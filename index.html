<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d6403a" id="themeColor">
<meta name="color-scheme" content="light dark">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('cries-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<title>Cris Pokémon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #d6403a;
    --ink: #1a2230;
    --muted: #5d6675;
    --paper: #eceff3;
    --tile: #ffffff;
    --line: #d5dae2;
    --bar: #1a2230;
    --accent-ui: var(--accent);
    --hero-bg: color-mix(in srgb, var(--accent) 14%, #fff);
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
  }
  /* ---------- Mode sombre ---------- */
  :root[data-theme="dark"] {
    --ink: #e8ecf2;
    --muted: #9aa5b6;
    --paper: #0f141c;
    --tile: #1a2230;
    --line: #2c3646;
    --bar: #141b26;
    --accent-ui: color-mix(in srgb, var(--accent) 70%, #fff);
    --hero-bg: color-mix(in srgb, var(--accent) 25%, #2b3446);
    color-scheme: dark;
  }
  /* un fond clair derrière les Pokémon, pour que les sombres restent visibles */
  :root[data-theme="dark"] .mon img,
  :root[data-theme="dark"] .gmon img,
  :root[data-theme="dark"] .evo-mon img { background: #ffffff1f; border-radius: 50%; }

  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent-ui); outline-offset: 2px; }

  header { padding: 18px 16px 6px; }
  h1 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }
  .head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }

  .controls {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--tabs-h)); z-index: 5;
    background: var(--paper);
    padding: 10px 0 12px;
    border-bottom: 1px solid var(--line);
  }
  .gens {
    display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 10px;
    scrollbar-width: none; scroll-snap-type: x proximity;
  }
  .gens::-webkit-scrollbar { display: none; }
  .gen, .gchip {
    flex: none; scroll-snap-align: start;
    border: 2px solid var(--line); background: var(--tile);
    border-radius: 14px; padding: 8px 14px; min-height: 48px;
    text-align: left; cursor: pointer; line-height: 1.15;
  }
  .gen b, .gchip b { display: block; font-size: 1.15rem; font-weight: 800; }
  .gen span, .gchip span { font-size: 0.78rem; color: var(--muted); }
  .gen[aria-pressed="true"], .gchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent-ui); color: #fff; }
  .gen[aria-pressed="true"] span, .gchip[aria-pressed="true"] span { color: rgba(255,255,255,.85); }

  .search { padding: 0 16px; }
  .search input {
    width: 100%; min-height: 48px; border-radius: 14px;
    border: 2px solid var(--line); background: var(--tile);
    padding: 0 14px; font: inherit; font-size: 1rem; color: var(--ink);
  }
  .search input:focus { border-color: var(--accent-ui); outline: none; }

  .count { margin: 12px 16px 4px; color: var(--muted); font-size: 0.9rem; }

  .grid {
    display: grid; gap: 10px; padding: 8px 16px 16px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  @media (min-width: 480px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 680px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

  .mon {
    background: var(--tile); border: 2px solid transparent; border-radius: 16px;
    padding: 8px 4px 10px; cursor: pointer; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-height: 48px;
  }
  .mon img { width: 100%; max-width: 150px; height: auto; aspect-ratio: 1; }
  .mon .num { font-size: 0.85rem; color: var(--muted); }
  .mon .name { font-size: 1rem; font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; }
  .mon[aria-pressed="true"] { border-color: var(--accent-ui); }
  .mon.playing img { animation: pulse .5s ease-in-out 2; }
  @keyframes pulse { 50% { transform: scale(1.14); } }
  @media (prefers-reduced-motion: reduce) { .mon.playing img { animation: none; } }

  .empty { padding: 32px 24px; text-align: center; color: var(--muted); }

  .player {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--bar); color: #fff;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center;
    border-top: 4px solid var(--accent-ui);
  }
  .player img { width: 56px; height: 56px; background: #fff1; border-radius: 12px; }
  .player .who { min-width: 0; }
  .player .who b { display: block; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .who small { color: #c3cad6; font-size: 0.82rem; display: block; min-height: 1.2em; }
  .replay {
    width: 56px; height: 56px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 1.4rem;
  }
  .replay:disabled { opacity: .4; cursor: default; }
  .mode { grid-column: 1 / -1; display: flex; gap: 6px; }
  .mode button {
    flex: 1; min-height: 44px; border-radius: 12px; border: 2px solid #ffffff33;
    background: transparent; color: #fff; cursor: pointer; font-size: 0.9rem;
  }
  .mode button[aria-pressed="true"] { background: #fff; color: var(--bar); border-color: #fff; }

  /* ---------- Fiche détaillée ---------- */
  .sheet {
    position: fixed; inset: 0; z-index: 8; background: var(--paper);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .sheet[hidden] { display: none; }
  .sheet-top {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--line); background: var(--paper);
  }
  .sheet-top .ttl { flex: 1; min-width: 0; font-weight: 800; font-size: 1.1rem; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-top .ttl span:first-child { color: var(--muted); font-weight: 600; margin-right: 6px; }
  .icon-btn {
    flex: none; width: 48px; height: 48px; border-radius: 14px; cursor: pointer;
    border: 2px solid var(--line); background: var(--tile); font-size: 1.4rem; line-height: 1;
  }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .sheet-body {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    padding: 16px 16px calc(180px + env(safe-area-inset-bottom, 0px));
    max-width: 720px; width: 100%; margin: 0 auto;
  }
  .hero { display: flex; justify-content: center; }
  .hero img {
    width: 220px; height: 220px; object-fit: contain; border-radius: 50%;
    background: var(--hero-bg);
  }
  .genus { text-align: center; margin: 12px 0 8px; color: var(--muted); font-size: 1rem; min-height: 1.2em; }
  .types { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; min-height: 34px; }
  .type { padding: 6px 16px; border-radius: 999px; font-weight: 800; font-size: 0.95rem; }
  .sheet h2 { font-size: 1.2rem; font-weight: 800; margin: 26px 0 10px; letter-spacing: -0.01em; }
  .desc { margin: 0; font-size: 1.05rem; line-height: 1.5; max-width: 60ch; }
  .src { margin: 6px 0 0; color: var(--muted); font-size: 0.85rem; }
  .muted { color: var(--muted); margin: 0; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 22px 0 0; }
  .fact { background: var(--tile); border-radius: 14px; padding: 10px 14px; }
  .fact.wide { grid-column: 1 / -1; }
  .fact dt { color: var(--muted); font-size: 0.85rem; }
  .fact dd { margin: 2px 0 0; font-weight: 600; font-size: 1.05rem; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent-ui); }

  .evo-node { display: flex; flex-direction: column; gap: 8px; }
  .evo-children { margin-left: 26px; padding-left: 14px; border-left: 3px solid var(--line);
    display: flex; flex-direction: column; gap: 12px; }
  .evo-cond { font-size: 0.9rem; color: var(--muted); margin: 2px 0 6px; }
  .evo-mon {
    display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer;
    background: var(--tile); border: 2px solid transparent; border-radius: 14px;
    padding: 4px 16px 4px 4px; min-height: 56px; width: fit-content; max-width: 100%;
  }
  .evo-mon img { width: 56px; height: 56px; }
  .evo-mon span { font-weight: 600; }
  .evo-mon.current { border-color: var(--accent-ui); }

  .where-ver { font-weight: 800; margin: 14px 0 6px; }
  .where-ver:first-child { margin-top: 0; }
  .where-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .where-list li { background: var(--tile); border-radius: 12px; padding: 8px 12px; }
  .where-list b { display: block; font-weight: 600; }
  .where-list span { color: var(--muted); font-size: 0.88rem; }
  .where-more { color: var(--muted); font-size: 0.9rem; margin: 6px 2px 0; }

  /* ---------- Légendaires et fabuleux : cadre violet pastel → turquoise ---------- */
  :root { --rare: linear-gradient(135deg, #bfa8f2 0%, #8fd8e6 50%, #45d6c8 100%); }
  .mon.rare, .evo-mon.rare, .grow.rare {
    border: 3px solid transparent;
    background: linear-gradient(var(--tile), var(--tile)) padding-box, var(--rare) border-box;
  }
  .mon.rare[aria-pressed="true"], .evo-mon.rare.current {
    border-color: transparent; box-shadow: 0 0 0 3px var(--accent-ui);
  }
  .hero img.rare {
    border: 6px solid transparent;
    background:
      linear-gradient(var(--hero-bg), var(--hero-bg)) padding-box,
      var(--rare) border-box;
  }
  /* ---------- Pokémon possédés ---------- */
  .own-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px 16px 10px; }
  .own-row span { font-weight: 600; }
  .reset {
    min-height: 44px; padding: 0 16px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--line); background: var(--tile); font-weight: 600;
  }
  .reset:disabled { opacity: .4; cursor: default; }
  .cell { position: relative; }
  .cell .mon { width: 100%; height: 100%; }
  .own {
    position: absolute; top: -6px; right: -6px; width: 44px; height: 44px;
    padding: 0; border: 0; background: none; cursor: pointer;
  }
  .own::before {
    content: ""; position: absolute; top: 9px; right: 9px; width: 24px; height: 24px;
    border-radius: 50%; border: 2px solid var(--muted); background: var(--tile);
  }
  .own[aria-checked="true"]::before { background: var(--accent); border-color: var(--accent-ui); }
  .own[aria-checked="true"]::after {
    content: "✓"; position: absolute; top: 9px; right: 9px; width: 24px; height: 24px;
    line-height: 24px; text-align: center; color: #fff; font-weight: 800; font-size: 0.9rem;
  }
  .own-line {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 48px; margin-top: 10px; font-weight: 600; cursor: pointer;
  }
  .own-line input { width: 24px; height: 24px; accent-color: var(--accent); }
  .rare-badge { text-align: center; margin: 6px 0 10px; }
  .rare-badge[hidden] { display: none; }
  .rare-badge span {
    display: inline-block; padding: 5px 16px; border-radius: 999px;
    background: var(--rare); color: #1a2230; font-weight: 800; font-size: 0.95rem;
  }
  /* ---------- Onglets ---------- */
  :root { --tabs-h: 60px; }
  .tabs {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 7;
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    height: var(--tabs-h); padding: 8px 16px; background: var(--paper);
  }
  .tabs button {
    min-height: 44px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--line); background: var(--tile); font-weight: 800; font-size: 1rem;
  }
  .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent-ui); color: #fff; }

  /* ---------- Onglet « Mes jeux » ---------- */
  .gtop { padding-top: 2px; }
  .gprog {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center;
    margin: 2px 16px 12px;
  }
  .gprog .gcount { font-weight: 800; font-size: 1.05rem; }
  .gprog .bar { grid-column: 1 / -1; }
  .gcontrols {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--tabs-h)); z-index: 5;
    background: var(--paper); padding: 10px 16px 12px; border-bottom: 1px solid var(--line);
    display: grid; gap: 10px;
  }
  .gcontrols .search { padding: 0; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg button {
    min-height: 52px; border-radius: 12px; cursor: pointer; padding: 4px;
    border: 2px solid var(--line); background: var(--tile); font-weight: 700; font-size: 0.9rem; line-height: 1.2;
  }
  .seg small { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] small { color: rgba(255,255,255,.9); }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent-ui); color: #fff; }

  .glist { list-style: none; margin: 0; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .grow {
    background: var(--tile); border: 2px solid transparent; border-radius: 16px;
    display: grid; grid-template-columns: 52px 60px minmax(0, 1fr); align-items: center;
    padding: 4px 8px 4px 0;
  }
  .gchk { position: relative; width: 52px; height: 60px; border: 0; background: none; padding: 0; cursor: pointer; }
  .gchk::before {
    content: ""; position: absolute; top: 50%; left: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px;
    border-radius: 50%; border: 2px solid var(--muted); background: var(--tile);
  }
  .gchk[aria-checked="true"]::before { background: var(--accent); border-color: var(--accent-ui); }
  .gchk[aria-checked="true"]::after {
    content: "\2713"; position: absolute; top: 50%; left: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px;
    line-height: 28px; text-align: center; color: #fff; font-weight: 800;
  }
  .gmon {
    border: 0; background: none; padding: 0; cursor: pointer; min-height: 60px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .gmon img { width: 52px; height: 52px; }
  .gmon .gnum { font-size: 0.72rem; color: var(--muted); }
  .gmain {
    border: 0; background: none; text-align: left; cursor: pointer; width: 100%; min-height: 60px;
    padding: 6px 0 6px 6px; display: flex; align-items: center; gap: 8px;
  }
  .gtext { flex: 1; min-width: 0; }
  .gname { display: block; font-weight: 800; font-size: 1.05rem; }
  .gsum { display: block; color: var(--muted); font-size: 0.88rem; margin-top: 2px; line-height: 1.3; }
  .chev { flex: none; color: var(--muted); font-size: 1.1rem; transition: transform .15s; }
  .gmain[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .grow.plain .chev { display: none; }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
  .gdetail { grid-column: 3; padding: 0 0 8px 6px; }
  .gdetail[hidden] { display: none; }
  .gdetail .evo { margin: 0 0 8px; font-weight: 600; font-size: 0.92rem; }
  .gdetail ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .gdetail li { border-top: 1px solid var(--line); padding-top: 6px; }
  .gdetail li b { display: block; font-weight: 600; }
  .gdetail li span { display: block; color: var(--muted); font-size: 0.86rem; line-height: 1.3; }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <div>
      <h1>Cris Pokémon</h1>
      <p class="sub">Choisis une génération, touche un Pokémon, écoute son cri.</p>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Passer en mode sombre">🌙</button>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" id="tabDex" aria-selected="true" aria-controls="viewDex">Pokédex</button>
  <button role="tab" id="tabGames" aria-selected="false" aria-controls="viewGames">Mes jeux</button>
</nav>

<div id="viewDex" role="tabpanel" aria-labelledby="tabDex">
<div class="own-row">
  <span id="ownTotal"></span>
  <button class="reset" id="resetOwn">Réinitialiser</button>
</div>

<div class="controls">
  <div class="gens" id="gens" role="group" aria-label="Génération"></div>
  <div class="search">
    <input id="q" type="search" inputmode="search" autocomplete="off"
           placeholder="Nom ou numéro" aria-label="Rechercher un Pokémon">
  </div>
</div>

<p class="count" id="count" aria-live="polite"></p>
<div class="grid" id="grid"></div>
</div>

<section id="viewGames" role="tabpanel" aria-labelledby="tabGames" hidden>
  <div class="gtop">
    <div class="gens" id="gPicker" role="group" aria-label="Jeu"></div>
    <div class="gprog">
      <span class="gcount" id="gCount"></span>
      <button class="reset" id="gReset">Réinitialiser</button>
      <div class="bar"><i id="gBar" style="width:0%"></i></div>
    </div>
  </div>
  <div class="gcontrols">
    <div class="search">
      <input id="gQ" type="search" inputmode="search" autocomplete="off"
             placeholder="Nom, numéro ou lieu" aria-label="Rechercher dans ce jeu">
    </div>
    <div class="seg" role="group" aria-label="Filtrer la liste">
      <button id="fAll" data-f="all" aria-pressed="true">Tous</button>
      <button id="fMiss" data-f="missing" aria-pressed="false">Manquants</button>
      <button id="fOwn" data-f="owned" aria-pressed="false">Possédés</button>
    </div>
  </div>
  <ul class="glist" id="gList"></ul>
</section>

<section class="sheet" id="sheet" hidden aria-label="Fiche du Pokémon">
  <div class="sheet-top">
    <button class="icon-btn" id="sClose" aria-label="Retour à la liste">←</button>
    <div class="ttl"><span id="sNum"></span><span id="sName"></span></div>
    <button class="icon-btn" id="sPrev" aria-label="Pokémon précédent">‹</button>
    <button class="icon-btn" id="sNext" aria-label="Pokémon suivant">›</button>
  </div>
  <div class="sheet-body" id="sBody">
    <div class="hero"><img id="sArt" alt=""></div>
    <p class="genus" id="sGenus"></p>
    <div class="rare-badge" id="sRare" hidden></div>
    <div class="types" id="sTypes"></div>
    <label class="own-line"><input type="checkbox" id="sOwn"> Je possède ce Pokémon</label>
    <dl class="facts" id="sFacts"></dl>
    <h2>Description du Pokédex</h2>
    <p class="desc" id="sDesc"></p>
    <p class="src" id="sDescSrc"></p>
    <h2>Évolutions</h2>
    <div id="sEvo"></div>
    <h2>Où le trouver</h2>
    <div id="sWhere"></div>
  </div>
</section>

<div class="player" id="player">
  <img id="pImg" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
  <div class="who">
    <b id="pName">Touche un Pokémon</b>
    <small id="pInfo">Le cri se lance tout de suite.</small>
  </div>
  <button class="replay" id="replay" aria-label="Rejouer le cri" disabled>▶</button>
  <div class="mode" role="group" aria-label="Version du cri">
    <button id="mOrigin" aria-pressed="true">Cri d’origine</button>
    <button id="mLatest" aria-pressed="false">Cri récent</button>
  </div>
</div>

  }
  try {
    const r = await fetch('https://pokeapi.co/api/v2/pokemon-species?limit=1025');
    const j = await r.json();
    j.results.forEach(x => {
      const id = Number(x.url.split('/').filter(Boolean).pop());
      names[id] = prettify(x.name);
    });
    render();
  } catch {}
  const data = await gql(p => `{ ${p}pokemonspeciesname(where:{language_id:{_eq:5}}) { pokemon_species_id name } }`);
  const rows = data && Object.values(data)[0];
  if (rows && rows.length) {
    rows.forEach(x => { names[x.pokemon_species_id] = x.name; });
    store.set('cries-names-v1', JSON.stringify(names));
    render();
  }
}

/* PokéAPI GraphQL : l'ancien endpoint (v1beta) est en cours d'arrêt, le nouveau est v1beta2.
   On essaie le nouveau, puis l'ancien. */
const GQL_ENDPOINTS = [
  { url: 'https://graphql.pokeapi.co/v1beta2', prefix: '' },
  { url: 'https://beta.pokeapi.co/graphql/v1beta', prefix: 'pokemon_v2_' },
];
async function gql(buildQuery) {
  for (const g of GQL_ENDPOINTS) {
    try {
      const r = await fetch(g.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: buildQuery(g.prefix) }),
      });
      const j = await r.json();
      if (j && j.data) return j.data;
    } catch {}
  }
  return null;
}

async function loadRare() {
  const cached = store.get('cries-rare-v1');
  if (cached) {
    try { rare = JSON.parse(cached); render(); return; } catch {}
  }
  const data = await gql(p => `{ ${p}pokemonspecies(where:{_or:[{is_legendary:{_eq:true}},{is_mythical:{_eq:true}}]}) { id is_legendary is_mythical } }`);
  const rows = data && Object.values(data)[0];
  if (rows && rows.length) {
    const fresh = {};
    rows.forEach(x => { fresh[x.id] = x.is_mythical ? 'mythical' : 'legendary'; });
    rare = fresh;
    store.set('cries-rare-v1', JSON.stringify(rare));
    render();
  }
}

  const items = [];
  for (let id = currentGen.from; id <= currentGen.to; id++) {

/* ------------------------------------------------------------------
   LECTURE DU CRI
------------------------------------------------------------------ */
function candidates(id) {
  const latest = { url: latestUrl(id), label: 'cri récent' };
  if (mode === 'latest') return [latest];
  const list = [];
  if (CUSTOM[currentGen.n]) list.push({ url: CUSTOM[currentGen.n](id), label: `cri de la génération ${currentGen.n}` });
  if (id <= LEGACY_MAX_ID) list.push({ url: legacyUrl(id), label: 'cri d’origine' });
  list.push(latest);
  return list;
}

async function playCry(id) {
  const list = candidates(id);
  const info = $('pInfo');
  for (let i = 0; i < list.length; i++) {
    try {
      audio.pause();
      audio.src = list[i].url;
      audio.currentTime = 0;
      await audio.play();
      info.textContent = i === 0
        ? `Génération ${currentGen.n} · ${list[i].label}`
        : `Pas de cri d’origine, ${list[i].label} joué`;
      return true;
    } catch (err) {
      if (err && err.name === 'NotAllowedError') { info.textContent = 'Touche ▶ pour lancer le son.'; return false; }
    }
  }
  info.textContent = 'Cri introuvable. Vérifie ta connexion.';
  return false;
}

function genOf(id) { return GENS.find(g => id >= g.from && id <= g.to) || GENS[0]; }

function select(id) {
  const g = genOf(id);
  if (g.n !== currentGen.n) setGen(g.n, true);
  selected = id;
  const name = names[id] || `Pokémon ${id}`;
  $('pName').textContent = `#${String(id).padStart(3, '0')} ${name}`;
  $('pImg').src = SPRITE(id);
  $('pImg').alt = name;
  $('replay').disabled = false;
  document.querySelectorAll('.mon').forEach(el => {
    el.setAttribute('aria-pressed', String(Number(el.dataset.id) === id));
    el.classList.toggle('playing', Number(el.dataset.id) === id);
  });
  playCry(id);
  openSheet();
  loadDetails(id);
  setTimeout(() => document.querySelectorAll('.mon.playing').forEach(el => el.classList.remove('playing')), 1100);
}

$('replay').addEventListener('click', () => { if (selected) playCry(selected); });

function setMode(m) {
  mode = m;

  $('mOrigin').setAttribute('aria-pressed', String(m === 'origin'));
  $('mLatest').setAttribute('aria-pressed', String(m === 'latest'));

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const jsonCache = new Map();
function getJson(url) {
  if (!jsonCache.has(url)) {
    const p = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    p.catch(() => jsonCache.delete(url));
    jsonCache.set(url, p);
  }
  return jsonCache.get(url);
}

const nameCache = new Map();
function frName(url, fallback) {
  if (!nameCache.has(url)) {
    nameCache.set(url, getJson(url).then(j => {
      const n = frLang(j.names);
      return n ? (n.name || n.awesome_name || fallback) : fallback;
    }).catch(() => fallback));
  }
  return nameCache.get(url);
}

async function frArea(url, fallback) {
  try {
    const a = await getJson(url);
    const n = frLang(a.names);
    if (n && n.name) return n.name;
    if (a.location) return await frName(a.location.url, fallback);
  } catch {}
  return fallback;
}

/* ---------- chargement principal ---------- */
function pickFlavor(species, genN) {
  const all = species.flavor_text_entries || [];
  const vs = GEN_VERSIONS[genN] || [];
  for (const lang of ['fr', 'en']) {
    const list = all.filter(e => e.language.name === lang);
    let e = null;
    for (const v of vs) { e = list.find(x => x.version.name === v); if (e) break; }
    if (!e && list.length) e = list[list.length - 1];
    if (e) return { text: cleanText(e.flavor_text), version: e.version.name, lang };
  }
  return null;
}

async function loadDetails(id) {
  const token = ++detailToken;
  const genN = currentGen.n;
  resetSheet(id);
  let poke, species;
  try {
    [poke, species] = await Promise.all([getJson(`${API}/pokemon/${id}`), getJson(`${API}/pokemon-species/${id}`)]);
  } catch {
    if (token !== detailToken) return;
    $('sDesc').textContent = 'Impossible de charger la fiche. Vérifie ta connexion.';
    $('sEvo').innerHTML = '';
    $('sWhere').innerHTML = '';
    return;
  }
  if (token !== detailToken) return;

  const frNameSpecies = frLang(species.names);
  if (frNameSpecies) { names[id] = frNameSpecies.name; $('sName').textContent = frNameSpecies.name; $('pName').textContent = `#${String(id).padStart(3, '0')} ${frNameSpecies.name}`; }

  const kind = species.is_mythical ? 'mythical' : species.is_legendary ? 'legendary' : null;
  if ((rare[id] || null) !== kind) {
    if (kind) rare[id] = kind; else delete rare[id];
    $('sArt').classList.toggle('rare', !!kind);
    showRareBadge(id);
    render();
  }

  const genus = frLang(species.genera) || (species.genera || []).find(g => g.language.name === 'en');
  $('sGenus').textContent = genus ? genus.genus : '';

  $('sTypes').innerHTML = poke.types.slice().sort((a, b) => a.slot - b.slot).map(t => {
    const T = TYPES[t.type.name] || [prettify(t.type.name), '#888', '#fff'];
    return `<span class="type" style="background:${T[1]};color:${T[2]}">${esc(T[0])}</span>`;
  }).join('');

  const fl = pickFlavor(species, genN);
  if (fl) {
    $('sDesc').textContent = fl.text;
    $('sDescSrc').textContent = `Version ${versionLabel(fl.version)}${fl.lang === 'en' ? ' · texte en anglais' : ''}`;
  } else {
    $('sDesc').textContent = 'Pas de description disponible.';
  }

  // évolutions et lieux en parallèle, sans bloquer le reste
  loadEvolutions(species, token);
  loadWhere(id, token, genN);

  const [abilities, shape] = await Promise.all([
    Promise.all(poke.abilities.slice().sort((a, b) => a.slot - b.slot).map(async a => {
      const n = await frName(a.ability.url, prettify(a.ability.name));
      return a.is_hidden ? `${n} (caché)` : n;
    })),
    species.shape ? frName(species.shape.url, prettify(species.shape.name)) : Promise.resolve('—'),
  ]);
  if (token !== detailToken) return;

  const kg = (poke.weight / 10).toFixed(1).replace('.', ',');
  const m = (poke.height / 10).toFixed(1).replace('.', ',');
  const rate = species.capture_rate;
  const eggs = (species.egg_groups || []).map(g => EGG_GROUPS[g.name] || prettify(g.name)).join(', ') || '—';
  const fact = (label, val, cls = '') => `<div class="fact ${cls}"><dt>${label}</dt><dd>${val}</dd></div>`;

  $('sFacts').innerHTML =
    fact('Poids', `${kg} kg`) +
    fact('Taille', `${m} m`) +
    fact('Taux de capture', `${rate} / 255<div class="bar"><i style="width:${Math.max(2, Math.round(rate / 255 * 100))}%"></i></div>`, 'wide') +
    fact('Groupe d’œuf', esc(eggs)) +
    fact('Forme', esc(shape)) +
    fact('Talents', abilities.map(esc).join(', ') || '—', 'wide');
}

/* ---------- évolutions ---------- */
async function describeOne(d) {
  const t = d.trigger && d.trigger.name;
  let main;
  if (t === 'level-up') main = d.min_level ? `Niv. ${d.min_level}` : 'Montée de niveau';
  else if (t === 'trade') main = 'Échange';
  else if (t === 'use-item') main = d.item ? `Utiliser ${await frName(d.item.url, prettify(d.item.name))}` : 'Utiliser un objet';
  else if (t === 'shed') main = 'Niv. 20, avec une place libre dans l’équipe et une Poké Ball';
  else main = TRIGGERS_FR[t] || 'Condition spéciale';

  const parts = [];
  if (d.held_item) parts.push(`en tenant ${await frName(d.held_item.url, prettify(d.held_item.name))}`);
  if (d.trade_species) parts.push(`contre ${nameOf(idFromUrl(d.trade_species.url), d.trade_species.name)}`);
  if (d.min_happiness) parts.push(`bonheur ≥ ${d.min_happiness}`);
  if (d.min_affection) parts.push(`affection ≥ ${d.min_affection}`);
  if (d.min_beauty) parts.push(`beauté ≥ ${d.min_beauty}`);
  if (d.known_move) parts.push(`en connaissant ${await frName(d.known_move.url, prettify(d.known_move.name))}`);
  if (d.known_move_type) parts.push(`en connaissant une capacité de type ${(TYPES[d.known_move_type.name] || [prettify(d.known_move_type.name)])[0]}`);
  if (d.location) parts.push(`à ${await frName(d.location.url, prettify(d.location.name))}`);
  if (d.time_of_day) parts.push({ day: 'de jour', night: 'de nuit', dusk: 'au crépuscule' }[d.time_of_day] || d.time_of_day);
  if (d.gender === 1) parts.push('femelle uniquement');
  if (d.gender === 2) parts.push('mâle uniquement');
  if (d.needs_overworld_rain) parts.push('sous la pluie');
  if (d.party_species) parts.push(`avec ${nameOf(idFromUrl(d.party_species.url), d.party_species.name)} dans l’équipe`);
  if (d.party_type) parts.push(`avec un Pokémon de type ${(TYPES[d.party_type.name] || [prettify(d.party_type.name)])[0]} dans l’équipe`);
  if (d.relative_physical_stats === 1) parts.push('Attaque > Défense');
  if (d.relative_physical_stats === -1) parts.push('Attaque < Défense');
  if (d.relative_physical_stats === 0) parts.push('Attaque = Défense');
  if (d.turn_upside_down) parts.push('console retournée');
  return parts.length ? `${main}, ${parts.join(', ')}` : main;
}

async function describeEvo(details) {
  if (!details || !details.length) return 'Évolution';
  const list = await Promise.all(details.map(describeOne));
  return [...new Set(list)].join(' ou ');
}

async function evoNodeHtml(node) {
  const id = idFromUrl(node.species.url);
  const name = nameOf(id, node.species.name);
  let html = `<div class="evo-node"><button class="evo-mon${id === selected ? ' current' : ''}${rare[id] ? ' rare' : ''}" data-id="${id}">` +
             `<img loading="lazy" alt="" src="${SPRITE(id)}"><span>${esc(name)}</span></button>`;
  if (node.evolves_to.length) {
    const kids = await Promise.all(node.evolves_to.map(async c => {
      const cond = await describeEvo(c.evolution_details);
      return `<div class="evo-branch"><div class="evo-cond">${esc(cond)}</div>${await evoNodeHtml(c)}</div>`;
    }));
    html += `<div class="evo-children">${kids.join('')}</div>`;
  }
  return html + '</div>';
}

async function loadEvolutions(species, token) {
  const box = $('sEvo');
  try {
    if (!species.evolution_chain) { box.innerHTML = '<p class="muted">Ce Pokémon n’évolue pas.</p>'; return; }
    const chain = await getJson(species.evolution_chain.url);
    if (token !== detailToken) return;
    if (!chain.chain.evolves_to.length) { box.innerHTML = '<p class="muted">Ce Pokémon n’a pas d’évolution.</p>'; return; }
    const html = await evoNodeHtml(chain.chain);
    if (token !== detailToken) return;
    box.innerHTML = html;
  } catch {
    if (token === detailToken) box.innerHTML = '<p class="muted">Impossible de charger les évolutions.</p>';
  }
}

$('sEvo').addEventListener('click', e => {
  const b = e.target.closest('.evo-mon');
  if (b) select(Number(b.dataset.id));
});

/* ---------- où le trouver ---------- */
const MAX_AREAS = 6;

async function loadWhere(id, token, genN) {
  const box = $('sWhere');
  let data;
  try { data = await getJson(`${API}/pokemon/${id}/encounters`); }
  catch { if (token === detailToken) box.innerHTML = '<p class="muted">Impossible de charger les lieux.</p>'; return; }
  if (token !== detailToken) return;

  const byVersion = {};
  data.forEach(loc => loc.version_details.forEach(vd => {
    const map = byVersion[vd.version.name] || (byVersion[vd.version.name] = new Map());
    const cur = map.get(loc.location_area.name) || { url: loc.location_area.url, methods: new Set(), min: 999, max: 0 };
    vd.encounter_details.forEach(ed => {
      cur.methods.add(ed.method.name);
      cur.min = Math.min(cur.min, ed.min_level);
      cur.max = Math.max(cur.max, ed.max_level);
    });
    map.set(loc.location_area.name, cur);
  }));

  let versions = (GEN_VERSIONS[genN] || []).filter(v => byVersion[v]);
  let note = '';
  if (!versions.length) {
    const other = ALL_VERSIONS.filter(v => byVersion[v]);
    if (!other.length) {
      box.innerHTML = '<p class="muted">Aucun lieu sauvage renseigné. Ce Pokémon s’obtient par évolution, cadeau, échange, événement ou dans un jeu absent de la base de données.</p>';
      return;
    }
    versions = [other[other.length - 1]];
    note = `<p class="muted">Rien de renseigné pour la génération ${genN}. Dernier jeu disponible :</p>`;
  }

  const areaJobs = [];
  let html = note;
  versions.forEach(v => {
    const areas = [...byVersion[v].entries()];
    html += `<div class="where-ver">Pokémon ${esc(versionLabel(v))}</div><ul class="where-list">`;
    areas.slice(0, MAX_AREAS).forEach(([slug, info], i) => {
      const fallback = prettify(slug.replace(/-area$/, ''));
      const methods = [...info.methods].map(m => METHODS_FR[m] || prettify(m)).join(', ');
      const lv = info.max ? (info.min === info.max ? `niv. ${info.min}` : `niv. ${info.min}–${info.max}`) : '';
      const key = `w-${v}-${i}`;
      html += `<li><b id="${key}">${esc(fallback)}</b><span>${esc([methods, lv].filter(Boolean).join(' · '))}</span></li>`;
      areaJobs.push({ key, url: info.url, fallback });
    });
    html += '</ul>';
    if (areas.length > MAX_AREAS) html += `<p class="where-more">+ ${areas.length - MAX_AREAS} autre${areas.length - MAX_AREAS > 1 ? 's' : ''} lieu${areas.length - MAX_AREAS > 1 ? 'x' : ''}</p>`;
  });
  box.innerHTML = html;

  // noms de lieux en français, au fur et à mesure
  areaJobs.forEach(async j => {
    const n = await frArea(j.url, j.fallback);
    if (token !== detailToken) return;
    const el = document.getElementById(j.key);
    if (el) el.textContent = n;
  });
}

/* ------------------------------------------------------------------
   ONGLETS ET LISTES PAR JEU
------------------------------------------------------------------ */
const GAME_METHOD = {
  walk: 'Herbes et grottes', surf: 'Surf', 'old-rod': 'Canne', 'good-rod': 'Super Canne', 'super-rod': 'Méga Canne',
  'rock-smash': 'Éclate-Roc', gift: 'Cadeau', 'gift-egg': 'Œuf cadeau', static: 'Rencontre fixe',
  pokeflute: 'Pokéflûte', 'roaming-grass': 'Errant', 'npc-trade': 'Échange avec un dresseur',
  'colosseum-bonus-disc-jpn': 'Événement',
};
const gm = m => GAME_METHOD[m] || prettify(m);
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const baseArea = a => a.replace(/\s*\(.*\)\s*$/, '');

/* Pokémon possédés, séparément pour chaque jeu */
const gameOwned = {};
try {
  const saved = JSON.parse(store.get('cries-games-owned-v1') || '{}') || {};
  Object.keys(saved).forEach(k => { gameOwned[k] = new Set((saved[k] || []).map(Number)); });
} catch {}
const gameSet = () => gameOwned[curGame().id] || (gameOwned[curGame().id] = new Set());
function saveGameOwned() {
  const o = {};
  Object.keys(gameOwned).forEach(k => { o[k] = [...gameOwned[k]]; });
  store.set('cries-games-owned-v1', JSON.stringify(o));
}

let gameFilter = 'all';
let gameQuery = '';
const gameOpen = new Set();         // lignes dépliées : "jeu:numéro"
const scrollPos = { dex: 0, games: 0 };

/* Prépare une fois les lignes d'un jeu (textes, résumé, texte de recherche) */
const prepared = {};
function prep(gameId) {
  if (prepared[gameId]) return prepared[gameId];
  const raw = GAME_DATA[gameId];
  if (!raw) return (prepared[gameId] = []);
  prepared[gameId] = raw.dex.map(([id, name, evo, places, elsewhere]) => {
    const rows = places.map(([a, m, lo, hi, pct, n]) =>
      ({ area: raw.areas[a], method: m, lo, hi, pct, note: n >= 0 ? raw.notes[n] : '' }));
    const bases = [...new Set(rows.map(r => baseArea(r.area)))];
    const methods = [...new Set(rows.map(r => r.method))];
    let sum;
    if (rows.length) {
      const k = bases.length - 2;
      const head = bases.slice(0, 2).join(', ') + (k > 0 ? ` et ${k} autre${k > 1 ? 's' : ''}` : '');
      sum = (methods.length === 1 ? gm(methods[0]) + ' · ' : '') + head;
    } else if (evo) {
      sum = evo;
    } else if (elsewhere) {
      sum = `Absent de cette version · à échanger depuis ${elsewhere}`;
    } else {
      sum = 'Introuvable dans le jeu (événement)';
    }
    const hay = norm([name, ...rows.map(r => r.area), ...methods.map(gm), ...rows.map(r => r.note)].join(' '));
    return { id, name, evo, rows, sum, hay };
  });
  return prepared[gameId];
}

function placeLine(r) {
  const bits = [gm(r.method)];
  if (r.hi) bits.push(r.lo === r.hi ? `niv. ${r.lo}` : `niv. ${r.lo}–${r.hi}`);
  if (r.pct) bits.push(`${r.pct} %`);
  if (r.note) bits.push(r.note);
  return `<li><b>${esc(r.area)}</b><span>${esc(bits.join(' · '))}</span></li>`;
}

function rowHtml(e, have, open) {
  const g = curGame();
  const detail = e.rows.length
    ? (e.evo ? `<p class="evo">${esc(e.evo)}</p>` : '') + `<ul>${e.rows.map(placeLine).join('')}</ul>`
    : '';
  return `<li class="grow${rare[e.id] ? ' rare' : ''}${e.rows.length ? '' : ' plain'}" data-id="${e.id}">
    <button class="gchk" role="checkbox" aria-checked="${have}" aria-label="Je possède ${esc(e.name)} dans ${esc(g.name)}"></button>
    <button class="gmon" aria-label="Ouvrir la fiche de ${esc(e.name)}"><img loading="lazy" decoding="async" alt="" src="${SPRITE(e.id)}"><span class="gnum">#${String(e.id).padStart(3, '0')}</span></button>
    <button class="gmain" aria-expanded="${open}"><span class="gtext"><span class="gname">${esc(e.name)}</span><span class="gsum">${esc(e.sum)}</span></span><span class="chev" aria-hidden="true">▾</span></button>
    <div class="gdetail"${open ? '' : ' hidden'}>${detail}</div>
  </li>`;
}

function updateGameUi() {
  const list = prep(curGame().id), own = gameSet();
  let have = 0;
  list.forEach(e => { if (own.has(e.id)) have++; });
  const total = list.length;
  $('gCount').textContent = `${have} / ${total} possédés`;
  $('gBar').style.width = total ? `${Math.round(have / total * 100)}%` : '0%';
  $('gReset').disabled = have === 0;
  $('fAll').innerHTML = `Tous<small>${total}</small>`;
  $('fMiss').innerHTML = `Manquants<small>${total - have}</small>`;
  $('fOwn').innerHTML = `Possédés<small>${have}</small>`;
}

function renderGames() {
  const g = curGame(), own = gameSet();
  const q = norm(gameQuery.trim()).replace(/^#/, '');
  const digits = /^\d+$/.test(q);
  const items = prep(g.id).filter(e => {
    if (gameFilter === 'missing' && own.has(e.id)) return false;
    if (gameFilter === 'owned' && !own.has(e.id)) return false;
    if (!q) return true;
    return digits ? e.id === Number(q) : e.hay.includes(q);
  });
  $('gList').innerHTML = items.length
    ? items.map(e => rowHtml(e, own.has(e.id), gameOpen.has(`${g.id}:${e.id}`))).join('')
    : '<li class="empty">Aucun Pokémon ne correspond.</li>';
  updateGameUi();
}

function toggleGameOwned(id, li) {
  const own = gameSet();
  if (own.has(id)) own.delete(id); else own.add(id);
  saveGameOwned();
  li.querySelector('.gchk').setAttribute('aria-checked', String(own.has(id)));
  updateGameUi();
}

$('gList').addEventListener('click', e => {
  const li = e.target.closest('.grow');
  if (!li) return;
  const id = Number(li.dataset.id);
  if (e.target.closest('.gchk')) { toggleGameOwned(id, li); return; }
  if (e.target.closest('.gmon')) { select(id); return; }
  const main = e.target.closest('.gmain');
  if (!main) return;
  const det = li.querySelector('.gdetail');
  if (!det.firstElementChild) return;
  const open = det.hidden;
  det.hidden = !open;
  main.setAttribute('aria-expanded', String(open));
  const key = `${curGame().id}:${id}`;
  if (open) gameOpen.add(key); else gameOpen.delete(key);
});

$('gQ').addEventListener('input', e => { gameQuery = e.target.value; renderGames(); });
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  gameFilter = b.dataset.f;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  renderGames();
}));
$('gReset').addEventListener('click', () => {
  const own = gameSet();
  if (!own.size) return;
  if (!confirm(`Décocher les ${own.size} Pokémon cochés dans ${curGame().name} ? Cette action est définitive.`)) return;
  own.clear();
  saveGameOwned();
  renderGames();
});

function buildGamePicker() {
  const box = $('gPicker');
  GAMES.forEach(g => {
    const b = document.createElement('button');
    b.className = 'gchip';
    b.dataset.game = g.id;
    b.innerHTML = `<b>${esc(g.name)}</b><span>${esc(g.region)} · Gén. ${g.gen}</span>`;
    b.addEventListener('click', () => setGame(g.id));
    box.appendChild(b);
  });
}
function setGame(id) {
  activeGameId = (GAMES.find(g => g.id === id) || GAMES[0]).id;
  store.set('cries-game', activeGameId);
  document.querySelectorAll('.gchip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.game === activeGameId)));
  gameQuery = '';
  $('gQ').value = '';
  applyAccent();
  renderGames();
}

function setTab(t, save) {
  if (t !== 'dex' && t !== 'games') t = 'dex';
  scrollPos[activeTab] = window.scrollY;
  activeTab = t;
  $('viewDex').hidden = t !== 'dex';
  $('viewGames').hidden = t !== 'games';
  $('tabDex').setAttribute('aria-selected', String(t === 'dex'));
  $('tabGames').setAttribute('aria-selected', String(t === 'games'));
  if (save) store.set('cries-tab', t);
  applyAccent();
  if (t === 'games') renderGames();
  window.scrollTo({ top: scrollPos[t] || 0 });
}
$('tabDex').addEventListener('click', () => setTab('dex', true));
$('tabGames').addEventListener('click', () => setTab('games', true));

buildGamePicker();
setGame(store.get('cries-game') || GAMES[0].id);
setTab(store.get('cries-tab') || 'dex', false);
</script>
